name: Update Instagram Data

on:
  schedule:
    # Runs every 30 minutes. GitHub may delay this slightly under load — that's normal.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Instagram data
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/fetch_instagram_data.py

      - name: Commit updated data.json and history.json
        run: |
          git config user.name "pem-data-bot"
          git config user.email "actions@github.com"
          git add data.json history.json
          git diff --quiet --cached || git commit -m "Update Instagram data [automated]"
          git push
