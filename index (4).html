<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peak Exposure Media — Client Pulse</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12151f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14182420;
    --bg-solid: #12151f;
    --bg-grad-1: #171c2a;
    --bg-grad-2: #10131c;
    --surface: #1d2233;
    --surface-2: #262c42;
    --line: #333b54;
    --gold: #c9a876;
    --gold-bright: #e6cd9c;
    --slate: #7d84a0;
    --text: #f3f1ea;
    --text-dim: #9aa0b8;
    --up: #93c08f;
    --flat: #7d84a0;
    --today: #e6cd9c;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(1200px 700px at 12% -10%, #202742 0%, transparent 60%),
      radial-gradient(1000px 600px at 100% 0%, #1a2036 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-grad-1), var(--bg-grad-2));
    color:var(--text);
    font-family:'Montserrat', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Bebas Neue', sans-serif; letter-spacing:0.03em; }

  /* ---------- Skyline signature element ---------- */
  .skyline-wrap{
    position:relative;
    overflow:hidden;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(201,168,118,0.05), transparent);
  }
  .skyline{
    position:absolute;
    bottom:0; left:0;
    width:220%;
    height:60px;
    opacity:0.16;
    animation: drift 90s linear infinite;
  }
  @keyframes drift{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce){
    .skyline{ animation:none; }
  }

  /* ---------- Header ---------- */
  header{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px clamp(20px,3vw,48px) 30px;
  }
  .brand{ display:flex; align-items:center; gap:16px; }
  .brand img{ height:34px; width:auto; display:block; }
  .brand-sep{ width:1px; height:28px; background:var(--line); }
  .brand-label{
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:600;
  }
  .header-right{ display:flex; align-items:center; gap:28px; }
  .week-range{ text-align:right; }
  .week-range .eyebrow{
    font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--text-dim); font-weight:600; margin-bottom:2px;
  }
  .week-range .value{ font-size:15px; color:var(--gold-bright); font-weight:600; }
  .clock{ text-align:right; min-width:118px; }
  .clock .time{ font-size:28px; font-family:'Bebas Neue'; letter-spacing:0.04em; color:var(--text); line-height:1; }
  .clock .date{ font-size:11px; color:var(--text-dim); margin-top:3px; letter-spacing:0.04em; }
  .live-pill{
    display:flex; align-items:center; gap:8px;
    padding:8px 14px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--surface);
  }
  .live-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--up);
    box-shadow:0 0 0 0 rgba(147,192,143,0.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(147,192,143,0.55); }
    70%{ box-shadow:0 0 0 8px rgba(147,192,143,0); }
    100%{ box-shadow:0 0 0 0 rgba(147,192,143,0); }
  }
  .live-pill span{ font-size:11px; letter-spacing:0.14em; font-weight:700; color:var(--text-dim); }

  /* ---------- Demo banner ---------- */
  .demo-banner{
    margin:0 clamp(20px,3vw,48px) 8px;
    padding:10px 16px;
    border:1px dashed rgba(201,168,118,0.45);
    border-radius:10px;
    background:rgba(201,168,118,0.06);
    color:var(--gold-bright);
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.02em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .demo-banner b{ color:var(--gold-bright); }

  /* ---------- Grid ---------- */
  .view-switch{
    display:flex; align-items:center; gap:10px;
    margin:0 clamp(20px,3vw,48px) 18px;
  }
  .view-btn{
    padding:8px 16px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--text-dim); font-size:12.5px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase; cursor:pointer;
  }
  .view-btn.active{ background:var(--gold); border-color:var(--gold); color:#1a1f30; }
  #month-select{
    padding:8px 14px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--text); font-size:13px; font-family:'Montserrat';
  }
  .month-metric-row{ display:flex; gap:10px; }
  .month-metric{ flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .month-metric .mm-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); margin-bottom:5px; }
  .month-metric .mm-value{ font-family:'Bebas Neue'; font-size:22px; color:var(--text); }
  .month-metric .mm-value.gold{ color:var(--gold-bright); }
  .month-empty{ font-size:12px; color:var(--text-dim); padding:8px 0; }

  main{ padding:10px clamp(20px,3vw,48px) 40px; }
  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:18px;
  }
  @media (max-width:1400px){ .grid{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:1000px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:620px){ .grid{ grid-template-columns:1fr; } }

  @media (max-width:760px){
    header{
      flex-direction:column;
      align-items:flex-start;
      gap:14px;
      padding:18px 16px 22px;
    }
    .header-right{
      width:100%;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }
    .week-range{ text-align:left; }
    .clock{ text-align:left; min-width:0; }
    .demo-banner{ margin:0 16px 8px; font-size:11.5px; }
    .view-switch{ margin:0 16px 14px; flex-wrap:wrap; }
    main{ padding:10px 16px 40px; }
    footer{ padding:16px 16px 26px; flex-direction:column; align-items:flex-start; gap:4px; }
  }

  @media (max-width:480px){
    .brand img{ height:26px; }
    .brand-label{ font-size:10.5px; }
    .live-pill{ padding:6px 11px; }
    .live-pill span{ font-size:10px; }
    .clock .time{ font-size:22px; }
    .week-range .value{ font-size:13px; }

    .grid{ gap:14px; }
    .card{ padding:16px 16px 15px; gap:13px; }
    .client-name{ font-size:18px; }
    .client-handle{ font-size:10.5px; }
    .avatar-badge{ width:34px; height:34px; font-size:14px; }
    .followers-count{ font-size:32px; }
    .followers-label{ font-size:10px; }
    .delta-chip{ font-size:11.5px; padding:4px 8px; }
    .metric .m-value{ font-size:17px; }
    .metrics-row{ gap:10px; }
    .dots{ gap:4px; }
    .dot{ border-radius:5px; }
    .dot-day{ font-size:8px; }
    .week-tracker-head .m-label,.metric .m-label{ font-size:9.5px; }
  }

  .card{
    position:relative;
    background:linear-gradient(180deg, var(--surface), #1a1f30);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 20px 18px;
    display:flex;
    flex-direction:column;
    gap:16px;
    transition:transform .4s ease, border-color .4s ease;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:20px; right:20px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(201,168,118,0.5), transparent);
  }
  .card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .client-name{ font-size:21px; line-height:1.05; color:var(--text); }
  .client-handle{ font-size:11.5px; color:var(--text-dim); margin-top:3px; letter-spacing:0.01em; }
  .avatar-badge{
    position:relative;
    width:38px; height:38px; border-radius:10px;
    background:var(--surface-2);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:16px; color:var(--gold-bright);
    flex-shrink:0;
  }
  .platform-badge{
    position:absolute;
    bottom:-6px; right:-6px;
    width:20px; height:20px;
    border-radius:7px;
    background:var(--bg-solid);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .platform-badge svg{ width:12px; height:12px; display:block; }

  .stat-row{ display:flex; align-items:baseline; gap:10px; }
  .followers-count{ font-family:'Bebas Neue'; font-size:40px; letter-spacing:0.02em; color:var(--text); line-height:1; }
  .followers-label{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; }
  .delta-chip{
    margin-left:auto;
    display:flex; align-items:center; gap:5px;
    padding:5px 9px;
    border-radius:8px;
    background:rgba(147,192,143,0.12);
    color:var(--up);
    font-size:12.5px;
    font-weight:700;
  }
  .delta-chip.flat{ background:rgba(125,132,160,0.12); color:var(--flat); }

  .divider{ height:1px; background:var(--line); }

  .metrics-row{ display:flex; gap:14px; }
  .metric{ flex:1; }
  .metric .m-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); margin-bottom:4px; }
  .metric .m-value{ font-size:20px; font-weight:700; color:var(--text); }
  .metric .m-value.gold{ color:var(--gold-bright); }

  .week-tracker{ display:flex; flex-direction:column; gap:8px; }
  .week-tracker-head{ display:flex; justify-content:space-between; align-items:baseline; }
  .week-tracker-head .m-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); }
  .week-tracker-head .m-count{ font-size:13px; font-weight:700; color:var(--gold-bright); }
  .dots{ display:flex; gap:6px; }
  .dot-wrap{ display:flex; flex-direction:column; align-items:center; gap:5px; flex:1; }
  .dot{
    width:100%; aspect-ratio:1/1; border-radius:6px;
    border:1.5px solid var(--line);
    background:transparent;
  }
  .dot.posted{ background:var(--gold); border-color:var(--gold); }
  .dot.today{ border-color:var(--today); box-shadow:0 0 0 2px rgba(230,205,156,0.18); }
  .dot-day{ font-size:9px; color:var(--text-dim); letter-spacing:0.06em; }

  .card-status{
    font-size:10.5px;
    letter-spacing:0.03em;
    color:var(--text-dim);
    text-align:center;
    padding-top:2px;
  }
  .card-status.error{ color:var(--flat); }

  footer{
    padding:16px clamp(20px,3vw,48px) 26px;
    display:flex; justify-content:space-between; align-items:center;
    color:var(--text-dim); font-size:11px; letter-spacing:0.04em;
  }
  footer a{ color:var(--text-dim); }
</style>
</head>
<body>

<div class="skyline-wrap">
  <svg class="skyline" viewBox="0 0 2400 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <polyline points="0,200 0,140 60,90 130,150 200,60 260,150 330,110 400,150 470,40 540,150 610,120 680,160 760,80 830,150 900,130 970,160 1050,50 1120,150 1190,100 1260,160 1330,70 1400,150 1470,120 1540,160 1610,90 1680,150 1750,110 1820,160 1890,60 1960,150 2030,100 2100,160 2170,80 2240,150 2310,120 2400,160 2400,200"
      fill="none" stroke="#c9a876" stroke-width="2"/>
  </svg>

  <header>
    <div class="brand">
      <img id="pem-logo" src="" alt="Peak Exposure Media" />
      <div class="brand-sep"></div>
      <div class="brand-label">Client Pulse</div>
    </div>
    <div class="header-right">
      <div class="live-pill"><span class="live-dot"></span><span>LIVE</span></div>
      <div class="week-range" id="week-range-row">
        <div class="eyebrow">Post week (Thu–Wed)</div>
        <div class="value" id="week-range">—</div>
      </div>
      <div class="clock">
        <div class="time" id="clock-time">--:--</div>
        <div class="date" id="clock-date">—</div>
      </div>
    </div>
  </header>
</div>

<div class="demo-banner" id="demo-banner">
  ⚠ <span><b>Demo data</b> — these numbers are simulated so you can preview the layout. Swap in the Instagram Graph API layer (see build notes) to make it live.</span>
</div>

<div class="view-switch" id="view-switch">
  <div class="view-btn active" id="view-btn-week">This Week</div>
  <div class="view-btn" id="view-btn-month">Monthly</div>
  <select id="month-select" style="display:none;"></select>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <span>Peak Exposure Media — internal dashboard</span>
  <span style="display:flex; gap:16px; align-items:center;">
    <a href="./entry.html" style="color:var(--text-dim); text-decoration:none; border-bottom:1px dotted var(--line);">Update numbers</a>
    <span id="refresh-note">Refreshing…</span>
  </span>
</footer>

async function tryLoadClientsJson(){
  try{
    const resp = await fetch('./clients.json', { cache: 'no-store' });
    if(!resp.ok) return;
    const json = await resp.json();
    if(Array.isArray(json) && json.length){
      // keep existing seedFollowers if a handle matches, for a smoother demo fallback
      CLIENTS = json.map(c => {
        const existing = CLIENTS.find(x => x.handle === c.handle);
        return { name:c.name, handle:c.handle, seedFollowers: existing ? existing.seedFollowers : 2000 };

    }

}

function monthKey(d){ return d.toISOString().slice(0,7); } // 'YYYY-MM'
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return new Date(Date.UTC(y, m-1, 1)).toLocaleDateString('en-US', { month:'long', year:'numeric', timeZone:'UTC' });
}
function monthBounds(key){
  const [y,m] = key.split('-').map(Number);
  const start = new Date(Date.UTC(y, m-1, 1));
  const end = new Date(Date.UTC(y, m, 0)); // last day of month
  return { start, end };
}

function buildAvailableMonths(){
  const keys = new Set();
  Object.values(DAILY_DATA).forEach(entries => {
    (entries || []).forEach(e => keys.add(e.date.slice(0,7)));
  });
  const now = new Date();
  keys.add(monthKey(now));
  const sorted = [...keys].sort().reverse();
  return sorted;
}

function populateMonthSelect(){
  const select = document.getElementById('month-select');
  const months = buildAvailableMonths();
  const now = new Date();
  const thisMonthKey = monthKey(now);
  // Default to previous full month if it exists in the list, else the most recent available.
  const prevMonthDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth()-1, 1));
  const prevMonthKey = monthKey(prevMonthDate);
  const defaultKey = months.includes(prevMonthKey) ? prevMonthKey : months[0];

  select.innerHTML = months.map(key => {
    const label = monthLabel(key) + (key === thisMonthKey ? ' (in progress)' : '');
    return `<option value="${key}">${label}</option>`;
  }).join('');
  select.value = defaultKey;
  SELECTED_MONTH = defaultKey;
}

function computeMonthlyStats(handle, key){
  const { start, end } = monthBounds(key);
  const startKey = start.toISOString().slice(0,10);
  const endKey = end.toISOString().slice(0,10);

  const entries = (DAILY_DATA[handle] || []).slice().sort((a,b) => a.date.localeCompare(b.date));
  const inMonth = entries.filter(e => e.date >= startKey && e.date <= endKey);

  if(!inMonth.length){
    return { hasData:false };
  }

  // Some entries only carry a "posted" flag (recorded the morning after) without a
  // follower count for that same date, or vice versa — filter separately so one
  // missing field doesn't break the other calculation.
  const followerEntriesInMonth = inMonth.filter(e => typeof e.followers === 'number');
  const followerEntriesBeforeMonth = entries.filter(e => e.date < startKey && typeof e.followers === 'number');

  let newFollowers = null;
  let endingFollowers = null;
  if(followerEntriesInMonth.length){
    const baseline = followerEntriesBeforeMonth.length
      ? followerEntriesBeforeMonth[followerEntriesBeforeMonth.length-1].followers
      : followerEntriesInMonth[0].followers;
    endingFollowers = followerEntriesInMonth[followerEntriesInMonth.length-1].followers;
    newFollowers = endingFollowers - baseline;
  }

  const totalPosts = inMonth.filter(e => e.posted).length;

  const weeklyEntries = (WEEKLY_DATA[handle] || []).filter(e => {
    const wk = e.weekStart.slice(0,7);
    return wk === key;
  });
  const avgEngagement = weeklyEntries.length
    ? weeklyEntries.reduce((sum,e) => sum + e.engagementRate, 0) / weeklyEntries.length
    : null;

  return {
    hasData:true,
    newFollowers,
    totalPosts,
    avgEngagement,
    endingFollowers
  };
}

/* ---------------- WEEK LOGIC (Thu -> Wed reset) ---------------- */
// Returns the Thursday that starts the current post-week, and the following Wednesday.
function getPostWeekRange(d = new Date()){
  const day = d.getDay(); // 0=Sun..6=Sat, Thu=4
  const diffToThu = (day - 4 + 7) % 7;
  const start = new Date(d);
  start.setHours(0,0,0,0);
  start.setDate(d.getDate() - diffToThu);
  const end = new Date(start);
  end.setDate(start.getDate() + 6); // following Wednesday
  return { start, end };
}
function fmtShort(d){ return d.toLocaleDateString('en-US',{ month:'short', day:'numeric' }); }

const DAY_ORDER = ["Thu","Fri","Sat","Sun","Mon","Tue","Wed"];

/* ---------------- MOCK DATA LAYER ----------------
   Replace `fetchAccountSnapshot` with a real call to your backend,
   e.g. fetch('/api/accounts/' + handle).then(r => r.json())
   It should resolve to: { followers, deltaToday, engagementRate, postDates: [ISO strings] }
------------------------------------------------------ */
function seededRandom(seed){
  let s = seed;
  return function(){
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}
function hashStr(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

function mockPostDates(client, weekStart){
  const rand = seededRandom(hashStr(client.handle) + weekStart.getDate());
  const count = 2 + Math.floor(rand()*4); // 2-5 posts this week
  const dates = [];
  const usedDays = new Set();
  let attempts = 0;
  while(dates.length < count && attempts < 30){
    attempts++;
    const dayOffset = Math.floor(rand()*7);
    const now = new Date();
    const candidate = new Date(weekStart);
    candidate.setDate(weekStart.getDate() + dayOffset);
    if(candidate > now) continue; // don't post in the "future"
    if(usedDays.has(dayOffset)) continue;
    usedDays.add(dayOffset);
    dates.push(candidate.toISOString());
  }
  return dates;
}

function mockAccountSnapshot(client, weekStart){
  const rand = seededRandom(hashStr(client.handle) + Math.floor(Date.now()/60000));
  const deltaToday = Math.floor(rand()*14) - 1; // -1 to 12
  const engagementRate = (1.4 + rand()*4.2);
  return {
    followers: client.seedFollowers + Math.floor(rand()*40),
    deltaToday,
    engagementRate,
    postDates: mockPostDates(client, weekStart),
    live:false
  };
}

function fetchAccountSnapshot(client, weekStart){
  if(LIVE_MODE && LIVE_DATA && LIVE_DATA.accounts && LIVE_DATA.accounts[client.handle]){
    const acc = LIVE_DATA.accounts[client.handle];
    if(acc.error){
      // Account is configured but couldn't be fetched (not connected, permissions, etc).
      // Fall back to mock for this one card so the layout doesn't break, but flag it.
      const mock = mockAccountSnapshot(client, weekStart);
      mock.accountError = acc.error;
      return mock;
    }
    return {
      followers: acc.followers,
      deltaToday: acc.deltaToday,
      engagementRate: acc.engagementRate,
      postDates: acc.postDates || [],
      live:true
    };
  }
  return mockAccountSnapshot(client, weekStart);
}

function initials(name){
  return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
}

function renderWeek(){
  document.getElementById('week-range-row').style.display = '';
  const { start, end } = getPostWeekRange();
  document.getElementById('week-range').textContent = fmtShort(start) + ' – ' + fmtShort(end);

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  CLIENTS.forEach(client => {
    const data = fetchAccountSnapshot(client, start);

    const postedDayIdx = new Set(data.postDates.map(iso => {
      const d = new Date(iso);
      const diff = Math.floor((d - start) / 86400000);
      return diff;
    }));

    const now = new Date();
    const todayIdx = Math.floor((now - start) / 86400000);

    const card = document.createElement('div');
    card.className = 'card';

    const deltaClass = data.deltaToday > 0 ? '' : 'flat';
    const deltaSign = data.deltaToday > 0 ? '+' : '';
    const deltaArrow = data.deltaToday > 0 ? '▲' : '–';

      statusHtml = `<div class="card-status error" title="${data.accountError.replace(/"/g,'&quot;')}">⚠ not connected — showing placeholder</div>`;

      statusHtml = `<div class="card-status">● demo data</div>`;
    }

    const dotsHtml = DAY_ORDER.map((label, idx) => {
      const posted = postedDayIdx.has(idx);
      const isToday = idx === todayIdx;
      return `<div class="dot-wrap">
        <div class="dot ${posted ? 'posted' : ''} ${isToday ? 'today' : ''}"></div>
        <div class="dot-day">${label}</div>
      </div>`;
    }).join('');

    card.innerHTML = `
      <div class="card-head">
        <div>
          <div class="client-name display">${client.name}</div>
          <div class="client-handle">${client.handle}</div>
        </div>
        <div class="avatar-badge">
          ${initials(client.name)}
          <div class="platform-badge" title="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="#c9a876" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/>
              <circle cx="12" cy="12" r="4.3"/>
              <circle cx="17.3" cy="6.7" r="0.6" fill="#c9a876" stroke="none"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="stat-row">
        <div class="followers-count display">${data.followers.toLocaleString()}</div>
        <div class="followers-label">followers</div>
        <div class="delta-chip ${deltaClass}">${deltaArrow} ${deltaSign}${data.deltaToday} today</div>
      </div>

      <div class="divider"></div>

      <div class="metrics-row">
        <div class="metric">
          <div class="m-label">Engagement rate (weekly)</div>

          <div class="m-label">Thu → Wed cycle</div>
          <div class="m-count">${data.postDates.length} posted</div>
        </div>
        <div class="dots">${dotsHtml}</div>
      </div>

      ${statusHtml}
    `;
    grid.appendChild(card);
  });
}

function renderMonth(){
  document.getElementById('week-range-row').style.display = 'none';
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  CLIENTS.forEach(client => {
    const stats = computeMonthlyStats(client.handle, SELECTED_MONTH);
    const card = document.createElement('div');
    card.className = 'card';

    let bodyHtml;
    if(!stats.hasData){
      bodyHtml = `<div class="month-empty">No daily entries logged for ${monthLabel(SELECTED_MONTH)} yet.</div>`;
    } else {
      const hasFollowerData = stats.endingFollowers !== null;
      const followersText = hasFollowerData ? stats.endingFollowers.toLocaleString() : '—';
      const deltaSign = (hasFollowerData && stats.newFollowers > 0) ? '+' : '';
      const newFollowersText = hasFollowerData ? `${deltaSign}${stats.newFollowers.toLocaleString()}` : '—';
      const engagementText = stats.avgEngagement !== null ? stats.avgEngagement.toFixed(1) + '%' : '—';
      bodyHtml = `
        <div class="stat-row" style="margin-bottom:14px;">
          <div class="followers-count display">${followersText}</div>
          <div class="followers-label">followers (end of month)</div>
        </div>
        <div class="month-metric-row">
          <div class="month-metric">
            <div class="mm-label">New followers</div>
            <div class="mm-value">${newFollowersText}</div>
          </div>
          <div class="month-metric">
            <div class="mm-label">Engagement (avg)</div>
            <div class="mm-value gold">${engagementText}</div>
          </div>
          <div class="month-metric">
            <div class="mm-label">Total posts</div>
            <div class="mm-value">${stats.totalPosts}</div>
          </div>
        </div>
      `;
    }

    card.innerHTML = `
      <div class="card-head">
        <div>
          <div class="client-name display">${client.name}</div>
          <div class="client-handle">${client.handle}</div>
        </div>
        <div class="avatar-badge">
          ${initials(client.name)}
          <div class="platform-badge" title="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="#c9a876" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/>
              <circle cx="12" cy="12" r="4.3"/>
              <circle cx="17.3" cy="6.7" r="0.6" fill="#c9a876" stroke="none"/>
            </svg>
          </div>
        </div>
      </div>
      <div class="divider" style="margin-bottom:14px;"></div>
      ${bodyHtml}
    `;
    grid.appendChild(card);
  });
}

function render(){
  if(VIEW_MODE === 'month'){
    renderMonth();
  } else {
    renderWeek();
  }
}

/* ---------------- CLOCK ---------------- */
function tickClock(){
  const now = new Date();
  document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-US',{ hour:'2-digit', minute:'2-digit' });
  document.getElementById('clock-date').textContent = now.toLocaleDateString('en-US',{ weekday:'long', month:'short', day:'numeric' });
}

function updateBanner(){
  const banner = document.getElementById('demo-banner');
  if(LIVE_MODE){
    const genAt = LIVE_DATA.generatedAt ? new Date(LIVE_DATA.generatedAt).toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : 'unknown';
    banner.innerHTML = `✓ <span><b>Live data</b> — pulled from data.json, generated ${genAt}. Any card marked "not connected" needs its Instagram account linked in the fetch script.</span>`;
    banner.style.borderColor = 'rgba(147,192,143,0.45)';
    banner.style.color = 'var(--up)';
  } else {
    banner.innerHTML = `⚠ <span><b>Demo data</b> — no data.json found yet (or it's empty), so these numbers are simulated. Once the GitHub Actions workflow runs, this dashboard switches to live data automatically.</span>`;
  }
}

async function refreshCycle(){
  await tryLoadClientsJson();
  await tryLoadDataJson();
  await tryLoadDailyWeekly();
  updateBanner();
  if(VIEW_MODE === 'month' && !document.getElementById('month-select').dataset.populated){
    populateMonthSelect();
    document.getElementById('month-select').dataset.populated = '1';
  }
  render();
  document.getElementById('refresh-note').textContent = 'Last refreshed ' + new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

document.getElementById('view-btn-week').addEventListener('click', () => {
  VIEW_MODE = 'week';
  document.getElementById('view-btn-week').classList.add('active');
  document.getElementById('view-btn-month').classList.remove('active');
  document.getElementById('month-select').style.display = 'none';
  render();
});

document.getElementById('view-btn-month').addEventListener('click', () => {
  VIEW_MODE = 'month';
  document.getElementById('view-btn-month').classList.add('active');
  document.getElementById('view-btn-week').classList.remove('active');
  const select = document.getElementById('month-select');
  select.style.display = '';
  if(!select.dataset.populated){
    populateMonthSelect();
    select.dataset.populated = '1';
  }
  render();
});

document.getElementById('month-select').addEventListener('change', (e) => {
  SELECTED_MONTH = e.target.value;
  render();
});

tickClock();
setInterval(tickClock, 1000);
refreshCycle();
setInterval(refreshCycle, 60000); // re-check data.json every 60s (the Action itself updates it every ~30 min)
</script>
</body>
</html>
