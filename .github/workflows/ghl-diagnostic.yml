name: GHL Diagnostic (one-time test)

on:
  workflow_dispatch: {} # run manually from the Actions tab — click "Run workflow"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run diagnostic
        env:
          GHL_PRIVATE_TOKEN: ${{ secrets.GHL_PRIVATE_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: python scripts/ghl_diagnostic.py
